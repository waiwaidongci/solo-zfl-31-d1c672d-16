<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台 · 上机织造</title>
  <link rel="stylesheet" href="src/ui/app.css">
</head>
<body>
  <header>
    <div>
      <h1>手工织锦纹样排版台</h1>
      <div>绘制经纬网格纹样,编排穿综与梭序,联查开口并回放织造。</div>
    </div>
    <nav class="tabs" aria-label="页面切换">
      <button id="tabBtnPattern" class="tab active" type="button">纹样绘制</button>
      <button id="tabBtnLoom" class="tab" type="button">上机织造</button>
    </nav>
  </header>

  <!-- ==================== 纹样绘制(原有功能,全部保留) ==================== -->
  <main class="app" id="tab-pattern">
    <aside class="panel">
      <h2>画布</h2>
      <label for="cols">经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label for="rows">纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn" type="button">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary" type="button">单点</button>
        <button data-block="cross" class="secondary" type="button">十字</button>
        <button data-block="diamond" class="secondary" type="button">小菱形</button>
      </div>
      <h2>方案</h2>
      <div class="toolbar">
        <button id="saveBtn" type="button">保存方案</button>
        <button id="exportBtn" class="secondary" type="button">导出JSON</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar">
        <button id="undoBtn" class="secondary" type="button">撤销</button>
        <button id="redoBtn" class="secondary" type="button">重做</button>
      </div>
      <p>点击填色,按住拖动可连续填色。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <!-- ==================== 上机织造(新增) ==================== -->
  <main class="app loom" id="tab-loom" hidden>
    <aside class="panel" id="loomSetup">
      <h2>经线映射</h2>
      <p class="hint">色线 → 经线:点选色线后点击经线条改色。</p>
      <div class="palette small" id="warpPalette"></div>
      <div class="scroll-x"><canvas id="warpMap" height="26"></canvas></div>
      <button id="warpAutoBtn" class="secondary" type="button">按列主色重排经线</button>

      <h2>综框登记</h2>
      <div id="frameList" class="frame-list"></div>
      <button id="addFrameBtn" class="secondary" type="button">+ 登记综框</button>

      <h2>穿筘与边组织</h2>
      <label for="perDent">每筘齿穿入经数</label>
      <input id="perDent" type="number" min="1" max="4" step="1">
      <label for="dentsPerCm">筘密(筘齿/厘米)</label>
      <input id="dentsPerCm" type="number" min="1" max="12" step="0.5">
      <label for="edgeThreads">每侧边经(平纹边组织,2 片边综)</label>
      <input id="edgeThreads" type="number" min="0" max="16" step="1">
      <label for="maxFloat">浮长上限</label>
      <input id="maxFloat" type="number" min="2" max="12" step="1">
      <label for="repeatX">纹样经向重复</label>
      <input id="repeatX" type="number" min="1" max="8" step="1">
      <label for="repeatY">纹样纬向重复</label>
      <input id="repeatY" type="number" min="1" max="8" step="1">
      <div class="reed-info" id="reedInfo"></div>

      <h2>方案</h2>
      <div class="toolbar">
        <button id="exportPlanBtn" type="button">导出方案</button>
        <button id="importPlanBtn" class="secondary" type="button">导入方案</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </aside>

    <section class="panel loom-center">
      <div class="loom-toolbar">
        <button id="autoDraftBtn" type="button">自动编排(重排)</button>
        <button id="loomUndoBtn" class="secondary" type="button">撤销</button>
        <button id="loomRedoBtn" class="secondary" type="button">重做</button>
        <span class="replay">
          <button id="replayFirst" class="secondary" type="button" title="回到织口">⏮</button>
          <button id="replayPrev" class="secondary" type="button" title="上一投">◀</button>
          <button id="replayPlay" type="button" title="播放/暂停">▶</button>
          <button id="replayNext" class="secondary" type="button" title="下一投">▶|</button>
          <select id="replaySpeed" title="回放速度">
            <option value="800">慢</option>
            <option value="350" selected>中</option>
            <option value="120">快</option>
          </select>
        </span>
      </div>
      <div id="loomBanner" class="banner"></div>

      <h3>穿综图 <span class="hint">拖动经纱到别的综框;拖动左侧线号把综框换序;手机点经纱再点目标综框</span></h3>
      <div class="scroll-both canvas-wrap"><canvas id="draftCanvas"></canvas></div>

      <h3>开口序列 <span class="hint">每投一纬,黑格为综框提起;点击任意投跳到该投</span></h3>
      <div class="scroll-both canvas-wrap"><canvas id="shedCanvas"></canvas></div>

      <h3>织物模拟 <span class="hint">按当前穿综与梭序织出的布面,织口线随回放推进</span></h3>
      <div class="scroll-both canvas-wrap"><canvas id="fabricCanvas"></canvas></div>
    </section>

    <aside class="panel" id="loomReportPanel">
      <h2>梭序(纬线换色)</h2>
      <p class="hint">拖动 ≡ 或点选后用 ▲▼ 调整投序;每投一纬,可改行号与色线。</p>
      <div id="pickList" class="pick-list"></div>
      <div class="toolbar">
        <button id="addPickBtn" class="secondary" type="button">+ 加一投</button>
        <button id="resetPicksBtn" class="secondary" type="button">按纹样重置梭序</button>
      </div>

      <h2>联查报告</h2>
      <div id="loomReport"></div>
      <h2>用线量</h2>
      <div id="loomUsage" class="stats"></div>
    </aside>
  </main>

  <script src="src/engine/loom-engine.js"></script>
  <script src="src/ui/canvas-grid.js"></script>
  <script src="src/ui/pattern-tab.js"></script>
  <script src="src/ui/loom-tab.js"></script>
  <script src="src/ui/boot.js"></script>
</body>
</html>
